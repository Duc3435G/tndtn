<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trắc Nghiệm Kiến Thức Tổng Hợp</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --cyan: #00ffff;
            --vio: #8a2be2;
            --glow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        body {
            background: conic-gradient(from 0deg, rgba(0,255,255,.25), rgba(138,43,226,.25), rgba(0,255,255,.25)), linear-gradient(135deg, #020c1b, #001e2b);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        /* Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 0 20px rgba(255, 255, 255, 0.1);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.1);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .animate__animated {
            animation-duration: 0.4s;
        }
        #galaxy {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        /* Màn hình Loading */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #020c1b;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 255, 255, 0.2);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Typing effect cursor */
        .typing-container {
            display: inline-flex;
            align-items: center;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: var(--cyan);
            margin-left: 4px;
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        /* Hiệu ứng nháy 3 dấu chấm */
        .loading-dots .dot {
            opacity: 0.2;
            animation: dotBlink 1.4s infinite ease-in-out both;
        }
        .loading-dots .dot:nth-child(1) { animation-delay: 0s; }
        .loading-dots .dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBlink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(1); }
            40% { opacity: 1; transform: scale(1.2); }
        }
        /* Firework Canvas Container */
        #firework-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-6 relative">

    <!-- Màn hình Loading -->
    <div id="loading-screen">
        <div class="spinner mb-6"></div>
        <div class="text-white font-medium text-xl md:text-2xl tracking-wider mb-3 flex items-center justify-center">
            <span>Chờ xíu</span>
            <span class="loading-dots ml-0.5">
                <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
            </span>
        </div>
        <div class="h-8 text-cyan-300 font-semibold text-base md:text-lg tracking-widest drop-shadow flex items-center">
            <span class="typing-container">
                <span id="typing-signature"></span>
                <span class="cursor"></span>
            </span>
        </div>
    </div>

    <canvas id="galaxy"></canvas>
    <canvas id="firework-canvas"></canvas>

    <div class="flex flex-col items-center w-full max-w-2xl relative z-10">
        <div id="app" class="w-full glass-panel rounded-3xl shadow-2xl p-6 md:p-10 animate__animated animate__fadeIn">
            <!-- Khu vực hiển thị câu hỏi -->
            <div id="quiz-container">
                <h2 id="question-text" class="text-xl md:text-2xl font-bold text-white leading-relaxed drop-shadow-md mb-6 min-h-[4rem] transition-all"></h2>

                <div id="options-container" class="space-y-3 md:space-y-4">
                    <!-- Các nút đáp án render qua JS -->
                </div>
            </div>

            <!-- Khu vực hoàn thành -->
            <div id="result-container" class="hidden text-center py-8 animate__animated animate__zoomIn">
                <h2 class="text-4xl md:text-5xl font-bold text-white drop-shadow-md mb-6">Hoàn thành xuất sắc! 🎉</h2>
                <p class="text-lg md:text-xl text-white/90 drop-shadow mb-8 leading-relaxed">
                    Bạn đã trả lời đúng tất cả các câu hỏi kiến thức tổng hợp.
                </p>
                <button onclick="restartQuiz()" class="glass-btn text-white font-bold text-lg md:text-xl py-4 px-10 rounded-2xl shadow-lg transition duration-300 transform hover:scale-105 active:scale-95 border-cyan-400/50 hover:border-cyan-300">
                    Làm lại từ đầu 🔄
                </button>
            </div>
        </div>
    </div>

    <!-- Chữ Made by Lucas ở góc dưới bên phải -->
    <div class="fixed bottom-3 right-4 z-20 text-xs md:text-sm text-white/40 tracking-wider font-mono pointer-events-none select-none">
        made by lucas
    </div>

    <script>
        /* =========================================================
           1. WEB AUDIO API SYNTHESIZER
           ========================================================= */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playClick() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }
            playCorrect() {
                this.init();
                const now = this.ctx.currentTime;
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.2, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.3);
                });
            }
            playWrong() {
                this.init();
                const now = this.ctx.currentTime;
                const freqs = [180, 130];
                freqs.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + i * 0.12);
                    gain.gain.setValueAtTime(0.2, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.2);
                });
            }
            playVictory() {
                this.init();
                const now = this.ctx.currentTime;
                const notes = [
                    { f: 523.25, t: 0 }, { f: 659.25, t: 0.12 }, { f: 783.99, t: 0.24 },
                    { f: 1046.50, t: 0.36 }, { f: 880, t: 0.5 }, { f: 1046.50, t: 0.7 }
                ];
                notes.forEach(note => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note.f, now + note.t);
                    gain.gain.setValueAtTime(0.25, now + note.t);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + note.t);
                    osc.stop(now + note.t + 0.4);
                });
            }
        }
        const sfx = new SoundFX();

        /* =========================================================
           2. GALAXY BACKGROUND ANIMATION
           ========================================================= */
        const cvs = document.getElementById('galaxy'), ctx = cvs.getContext('2d');
        let W, H, stars = [], meteors = []; 
        function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
        function makeStars(n) { stars = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + .2, v: Math.random() * 0.25 + 0.08 })); }
        
        window.addEventListener('resize', () => { size(); makeStars(Math.floor((W * H) / 4000)); });
        size();
        makeStars(Math.floor((W * H) / 4000));

        function drawGalaxy() {
            ctx.clearRect(0, 0, W, H);
            const grd = ctx.createRadialGradient(W * .7, H * .3, 0, W * .7, H * .3, Math.max(W, H) * .8); 
            grd.addColorStop(0, 'rgba(0,255,255,.06)'); 
            grd.addColorStop(1, 'transparent'); 
            ctx.fillStyle = grd; 
            ctx.fillRect(0, 0, W, H);
            
            ctx.fillStyle = '#fff'; 
            for (const s of stars) { 
                s.y += s.v; 
                if (s.y > H) { s.y = 0; s.x = Math.random() * W; } 
                ctx.beginPath(); 
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); 
                ctx.fill(); 
            }
            
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--cyan'); 
            ctx.lineWidth = 1.6;
            for (let i = meteors.length; i--;) { 
                const m = meteors[i]; 
                ctx.beginPath(); 
                ctx.moveTo(m.x, m.y); 
                ctx.lineTo(m.x - m.l * .6, m.y + m.l); 
                ctx.stroke(); 
                m.x += m.v * .35; 
                m.y += m.v; 
                if (m.y > H) meteors.splice(i, 1); 
            }
            if (Math.random() < 0.015) meteors.push({ x: Math.random() * W, y: 0, l: Math.random() * 90 + 40, v: Math.random() * 4 + 5 });
            requestAnimationFrame(drawGalaxy);
        }
        drawGalaxy();

        /* =========================================================
           3. FIREWORKS EFFECT (Khi chọn đúng đáp án)
           ========================================================= */
        const fCvs = document.getElementById('firework-canvas');
        const fCtx = fCvs.getContext('2d');
        let fW, fH, fireworks = [];

        function resizeFireworkCanvas() {
            fW = fCvs.width = window.innerWidth;
            fH = fCvs.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFireworkCanvas);
        resizeFireworkCanvas();

        function createFireworks(originX, originY) {
            const colors = ['#00ffff', '#8a2be2', '#ff00ff', '#ffff00', '#00ff00', '#ff4500'];
            const particleCount = 45;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                fireworks.push({
                    x: originX,
                    y: originY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    decay: 0.015 + Math.random() * 0.02,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: 2.5 + Math.random() * 2.5
                });
            }
        }

        function updateAndDrawFireworks() {
            fCtx.clearRect(0, 0, fW, fH);
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const p = fireworks[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08; // trọng lực kéo xuống
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    fireworks.splice(i, 1);
                    continue;
                }

                fCtx.save();
                fCtx.globalAlpha = p.alpha;
                fCtx.fillStyle = p.color;
                fCtx.beginPath();
                fCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                fCtx.fill();
                fCtx.restore();
            }
            requestAnimationFrame(updateAndDrawFireworks);
        }
        updateAndDrawFireworks();

        /* =========================================================
           4. TYPING EFFECT (Chữ gõ phím "Made by Lucas")
           ========================================================= */
        function typeWriter() {
            const text = "Made by Lucas";
            const element = document.getElementById("typing-signature");
            element.textContent = "";
            let i = 0;
            const speed = 100;

            function typing() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(typing, speed);
                }
            }
            setTimeout(typing, 300);
        }

        window.addEventListener('load', () => {
            typeWriter();
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.style.opacity = '0';
                loadingScreen.style.visibility = 'hidden';
            }, 3000);
        });

        /* =========================================================
           5. NGÂN HÀNG CÂU HỎI & LOGIC TRẮC NGHIỆM (12 CÂU)
           ========================================================= */
        const rawQuestions = [
            {
                question: "Quốc gia nào trên thế giới sở hữu quốc kỳ không phải là hình chữ nhật hay hình vuông (mà có dạng hai hình tam giác chồng lên nhau)?",
                options: ["Bhutan", "Nepal", "Thụy Sĩ", "Sri Lanka"],
                correct: 1
            },
            {
                question: "Quốc kỳ của Canada có hình biểu tượng nổi tiếng của chiếc lá nào ở chính giữa?",
                options: ["Lá sồi", "Lá phong", "Lá bạch dương", "Lá dâu tằm"],
                correct: 1
            },
            {
                question: "Quốc gia nào được mệnh danh là 'Đất nước Mặt Trời mọc'?",
                options: ["Hàn Quốc", "Nhật Bản", "Thái Lan", "Trung Quốc"],
                correct: 1
            },
            {
                question: "Lá quốc kỳ nổi tiếng với tên gọi 'Star-Spangled Banner' gồm 50 ngôi sao đại diện cho 50 tiểu bang là quốc kỳ của nước nào?",
                options: ["Úc", "Vương quốc Anh", "Hợp chủng quốc Hoa Kỳ (Mỹ)", "Brazil"],
                correct: 2
            },
            {
                question: "Quốc gia nào ở Nam Mỹ nổi tiếng là quốc gia duy nhất trên thế giới sử dụng tiếng Bồ Đào Nha làm ngôn ngữ chính thức?",
                options: ["Argentina", "Colombia", "Chile", "Brazil"],
                correct: 3
            },
            {
                question: "Hình ảnh chú chuột túi (Kangaroo) và chim đà điểu sa mạc (Emu) xuất hiện trên quốc huy của quốc gia độc đáo nào?",
                options: ["Úc (Australia)", "New Zealand", "Nam Phi", "Madagascar"],
                correct: 0
            },
            {
                question: "Trong hóa học, bảng hệ thống tuần hoàn các yếu tố hóa học đầu tiên do nhà khoa học nổi tiếng nào người Nga xây dựng nên?",
                options: ["Dmitri Mendeleev", "Antoine Lavoisier", "Marie Curie", "John Dalton"],
                correct: 0
            },
            {
                question: "Vào năm 1954, chiến thắng lịch sử nào của quân và dân ta đã 'lừng lẫy năm châu, chấn động địa cầu', kết thúc cuộc kháng chiến chống Pháp?",
                options: ["Chiến dịch Điện Biên Phủ", "Chiến dịch Hồ Chí Minh", "Chiến dịch Việt Bắc", "Chiến dịch Biên giới"],
                correct: 0
            },
            {
                question: "Tác phẩm tiểu thuyết nổi tiếng 'Đôn Ki-hô-tê' (Don Quixote) - nhà quý tộc tài ba xứ Mancha - là của nhà văn nào?",
                options: ["Victor Hugo", "Cervantes", "William Shakespeare", "Leo Tolstoy"],
                correct: 1
            },
            {
                question: "Trong cơ thể con người, chất sắt đóng vai trò quan trọng nhất trong việc cấu tạo nên thành phần nào sau đây?",
                options: ["Men răng", "Huyết cầu tố (Hemoglobin) trong máu", "Tế bào thần kinh", "Khớp xương"],
                correct: 1
            },
            {
                question: "Đơn vị đo cường độ dòng điện chuẩn trong hệ SI được đặt theo tên nhà vật lý nào?",
                options: ["Isaac Newton", "James Watt", "André-Marie Ampère", "Alessandro Volta"],
                correct: 2
            },
            {
                question: "Trong âm nhạc cơ bản, một quãng tám (Octave) tiêu chuẩn từ nốt Đô đến nốt Đô kế tiếp bao gồm bao nhiêu phím đàn (tính cả phím trắng và phím đen)?",
                options: ["7 phím", "8 phím", "12 phím", "10 phím"],
                correct: 2
            }
        ];

        let quizData = [];
        let currentIndex = 0;
        let totalQuestions = 0;

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function prepareQuiz() {
            const shuffledRaw = shuffleArray(rawQuestions);
            quizData = shuffledRaw.map(item => {
                const originalOptions = item.options;
                const correctAnswerText = originalOptions[item.correct];
                const shuffledOptions = shuffleArray(originalOptions);
                const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);

                return {
                    question: item.question,
                    options: shuffledOptions,
                    correct: newCorrectIndex
                };
            });

            currentIndex = 0;
            totalQuestions = quizData.length;
        }

        function startQuiz() {
            prepareQuiz();
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= totalQuestions) {
                showResult();
                return;
            }

            const q = quizData[currentIndex];
            const questionEl = document.getElementById('question-text');
            const optionsEl = document.getElementById('options-container');

            questionEl.classList.remove('animate__fadeIn');
            void questionEl.offsetWidth; 
            questionEl.classList.add('animate__fadeIn');
            questionEl.innerText = `Câu ${currentIndex + 1}: ${q.question}`;

            optionsEl.innerHTML = '';
            const optionLabels = ['A', 'B', 'C', 'D'];

            q.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn glass-btn w-full text-left p-4 md:p-5 rounded-2xl font-medium text-base md:text-lg text-white drop-shadow transition-all duration-200 transform hover:scale-[1.01] active:scale-[0.99] shadow-sm animate__animated animate__fadeInUp";
                btn.style.animationDelay = `${idx * 0.05}s`;
                btn.innerHTML = `<span class="font-bold uppercase mr-3 text-cyan-300 text-lg md:text-xl">${optionLabels[idx]}.</span> ${optText}`;
                
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const rect = btn.getBoundingClientRect();
                    selectAnswer(idx, btn, rect.left + rect.width / 2, rect.top + rect.height / 2);
                };
                optionsEl.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex, btnElement, btnX, btnY) {
            const currentQ = quizData[currentIndex];
            const allButtons = document.querySelectorAll('.option-btn');

            if (selectedIndex === currentQ.correct) {
                sfx.playCorrect();
                createFireworks(btnX, btnY);
                btnElement.className = "option-btn w-full text-left p-4 md:p-5 rounded-2xl font-medium text-base md:text-lg text-white shadow-sm bg-cyan-600/80 border-cyan-400 backdrop-blur-md animate__animated animate__pulse";

                allButtons.forEach(btn => btn.disabled = true);

                setTimeout(() => {
                    currentIndex++;
                    loadQuestion();
                }, 900);

            } else {
                sfx.playWrong();
                btnElement.className = "option-btn w-full text-left p-4 md:p-5 rounded-2xl font-medium text-base md:text-lg text-white shadow-sm bg-red-600/80 border-red-400 backdrop-blur-md animate__animated animate__shakeX";
                btnElement.style.animationDuration = '0.6s';
                btnElement.disabled = true; 
            }
        }

        function showResult() {
            sfx.playVictory();
            createFireworks(window.innerWidth / 2, window.innerHeight / 2);

            document.getElementById('quiz-container').classList.add('hidden');
            const resultContainer = document.getElementById('result-container');
            resultContainer.classList.remove('hidden');
        }

        function restartQuiz() {
            sfx.playClick();
            startQuiz();
        }

        startQuiz();
    </script>
</body>
</html>
